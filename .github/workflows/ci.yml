name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Upgrade installer
        run: python -m pip install --upgrade 'pip>=26.2'
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Dependency audit
        run: pip-audit
      - name: Unit tests
        run: pytest
      - name: Static correctness checks
        run: ruff check src tests scripts app --select E9,F
      - name: Compile Python
        run: python -m compileall -q src scripts app
