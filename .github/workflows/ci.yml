name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved 2026-09-15
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 resolved 2026-09-15
        with:
          python-version: '3.11'
          cache: pip
      - name: Upgrade installer/build tools
        run: python -m pip install --upgrade 'pip>=26.2' 'setuptools>=83'
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Dependency audit
        run: pip-audit
      - name: Unit tests
        run: pytest
      - name: Static correctness checks
        run: ruff check src tests scripts app --select E9,F
      - name: Compile Python
        run: python -m compileall -q src scripts app
